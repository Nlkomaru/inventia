name: Preview

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # GitHub Actions のランナーで EC2 のメタデータ取得を試みて待たされるのを防ぐ。
  AWS_EC2_METADATA_DISABLED: true
  # アップロード先バケット(nikomaru-ci)が公開されているドメイン。
  PREVIEW_BASE_URL: https://ci.nikomaru.dev/inventia

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy-app-preview:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App Preview
    outputs:
      deployment_url: ${{ steps.resolve-app-preview-url.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Load Preview Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "inventia"
          env: "preview"
          shared-keys: |
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm --filter ./app run build

      - name: Build storybook
        run: pnpm --filter ./storybook run build

      # Storybook は app と同じ Worker の static assets として配信する。
      # .cloudflare/output/v1/workers/default/assets 配下に置くことで /storybook で公開される。
      - name: Bundle storybook into app assets
        run: |
          rm -rf app/.cloudflare/output/v1/workers/default/assets/storybook
          cp -r storybook/storybook-static app/.cloudflare/output/v1/workers/default/assets/storybook

      - name: Prepare Worker secrets
        run: |
          umask 077
          printf 'SETTINGS_ENCRYPTION_KEY=%s\nOPENROUTER_MANAGEMENT_KEY=%s\n' "$SETTINGS_ENCRYPTION_KEY" "$OPENROUTER_MANAGEMENT_KEY" > app/.secrets.ci

      - name: Deploy app preview
        id: deploy-preview
        working-directory: app
        shell: bash
        run: |
          output=$(pnpm exec cf workers versions create --prebuilt --secrets-file .secrets.ci --message "Deployed preview by GitHub Actions branch ${{ github.ref_name }}" 2>&1)
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+' | head -n 1 || true)
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Remove Worker secrets file
        if: always()
        run: rm -f app/.secrets.ci

      - name: Resolve app preview URL
        id: resolve-app-preview-url
        env:
          CF_DEPLOYMENT_URL: ${{ steps.deploy-preview.outputs.deployment_url }}
        shell: bash
        run: |
          url="$CF_DEPLOYMENT_URL"
          if [ -z "$url" ]; then
            echo "Failed to resolve app preview URL from cf outputs."
            exit 1
          fi

          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

  comment:
    needs: [check, deploy-app-preview]
    if: always()
    runs-on: ubuntu-latest
    name: Comment Preview URLs
    # プレビュー URL のコメントだけのジョブなので、待たされた場合は
    # 既定の 6 時間ではなく短く打ち切る。
    timeout-minutes: 10
    steps:
      # QR の置き場所は Storybook と同じくコミット単位にそろえる。
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      # NIKO_CI_* は secret-manager (SSM Parameter Store) から GITHUB_ENV へ読み込む。
      - name: Load Preview Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "inventia"
          env: "preview"
          shared-keys: |
            NIKO_CI_AWS_ACCESS_KEY_ID
            NIKO_CI_AWS_SECRET_ACCESS_KEY
            NIKO_CI_AWS_REGION
            NIKO_CI_BUCKET_NAME
            NIKO_CI_S3_URL

      # QR の描画は pnpm の qrcode を dlx で取る。このジョブは checkout しないため
      # ワークスペースの依存としては入れられず、バージョンは実行時に固定する。
      # 版を上げるときは Render and upload QR codes の指定も合わせて変える。
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          # checkout しないジョブでは package.json の packageManager を読めないため明示する。
          version: 11.18.0
          run_install: false

      # GitHub の Markdown は data: URI の画像を表示しないため、QR は R2 へ置いて参照する。
      - name: Render and upload QR codes
        id: qr
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ env.NIKO_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.NIKO_CI_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: ${{ env.NIKO_CI_AWS_REGION }}
          BUCKET_NAME: ${{ env.NIKO_CI_BUCKET_NAME }}
          S3_URL: ${{ env.NIKO_CI_S3_URL }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          APP_PREVIEW_URL: ${{ needs.deploy-app-preview.outputs.deployment_url }}
        run: |
          STORYBOOK_PREVIEW_URL="${APP_PREVIEW_URL:+${APP_PREVIEW_URL%/}/storybook/}"
          # QR は補助情報なので、生成や配置に失敗してもコメント投稿までは止めない。
          # URL は -- の後ろへ置き、- で始まる場合でもオプションと解釈されないようにする。
          # -s はモジュール 1 つの辺の px、-q はクワイエットゾーンのモジュール数。
          upload_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! pnpm dlx qrcode@1.5.4 -t png -s 6 -q 2 -o "$name.png" -- "$url"; then
              echo "::warning::failed to render the $name QR code"
              return 0
            fi
            if [ ! -s "$name.png" ]; then
              echo "::warning::the rendered $name QR code is empty"
              return 0
            fi

            if ! aws s3 cp "$name.png" \
              "s3://${BUCKET_NAME}/inventia/${COMMIT_SHORT_SHA}/qr/$name.png" \
              --endpoint-url "${S3_URL}" \
              --content-type image/png \
              --only-show-errors; then
              echo "::warning::failed to upload the $name QR code"
              return 0
            fi

            echo "${name}_qr_url=${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/qr/$name.png" >> "$GITHUB_OUTPUT"
          }

          upload_qr app "$APP_PREVIEW_URL"
          upload_qr storybook "$STORYBOOK_PREVIEW_URL"

      - name: Create comment file
        env:
          APP_PREVIEW_URL: ${{ needs.deploy-app-preview.outputs.deployment_url }}
          APP_QR_URL: ${{ steps.qr.outputs.app_qr_url }}
          STORYBOOK_QR_URL: ${{ steps.qr.outputs.storybook_qr_url }}
        run: |
          STORYBOOK_PREVIEW_URL="${APP_PREVIEW_URL:+${APP_PREVIEW_URL%/}/storybook/}"
          # 表の1行を組み立てる。URL が無い場合も行は残し、状態が読み取れるようにする。
          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF

          row App "$APP_PREVIEW_URL" "$APP_QR_URL"
          row Storybook "$STORYBOOK_PREVIEW_URL" "$STORYBOOK_QR_URL"

          cat << 'EOF' >> comment.md

          スマートフォンから開く場合は QR を読み取ってください。プレビューは Cloudflare Access のサインインを求められます。
          EOF

      # push のたびにコメントが増えないよう、同じコメントを上書きしていく。
      - name: Create PR comment
        run: |
          # GitHub API が一時的に 503 を返すことがあるため数回まで再試行する。
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # comment ジョブは checkout しないため .git が無い。gh がリポジトリを
          # git から推測できず失敗するので、GH_REPO で対象リポジトリを明示する。
          GH_REPO: ${{ github.repository }}
