name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App and Storybook
    steps:
      - uses: actions/checkout@v4

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "inventia"
          env: "production"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app and storybook
        run: pnpm run build

      # Storybook は app と同じ Worker の static assets として配信する。
      # dist/client 配下に置くことで inventia.nikomaru.dev/storybook で公開される。
      - name: Bundle storybook into app assets
        run: |
          rm -rf app/dist/client/storybook
          cp -r storybook/storybook-static app/dist/client/storybook

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: app

      # Worker Versionsでは未deployの最新versionがあると通常のsecret更新が拒否される。
      # 先にcodeをdeployし、そのversionに対してsecretを別stepで同期する。
      - name: Upload Worker secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami
          secrets: |
            SETTINGS_ENCRYPTION_KEY
            OPENROUTER_MANAGEMENT_KEY
          workingDirectory: app
