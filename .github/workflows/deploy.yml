name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App and Storybook
    steps:
      - uses: actions/checkout@v4

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "inventia"
          env: "production"
          shared-keys: |
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app and storybook
        run: pnpm run build

      # Storybook は app と同じ Worker の static assets として配信する。
      # .cloudflare/output/v1/workers/default/assets 配下に置くことで inventia.nikomaru.dev/storybook で公開される。
      - name: Bundle storybook into app assets
        run: |
          rm -rf app/.cloudflare/output/v1/workers/default/assets/storybook
          cp -r storybook/storybook-static app/.cloudflare/output/v1/workers/default/assets/storybook

      - name: Prepare Worker secrets
        run: |
          umask 077
          printf 'SETTINGS_ENCRYPTION_KEY=%s\nOPENROUTER_MANAGEMENT_KEY=%s\n' "$SETTINGS_ENCRYPTION_KEY" "$OPENROUTER_MANAGEMENT_KEY" > app/.secrets.ci

      - name: Deploy
        working-directory: app
        run: pnpm exec cf deploy --prebuilt --secrets-file .secrets.ci

      - name: Remove Worker secrets file
        if: always()
        run: rm -f app/.secrets.ci
